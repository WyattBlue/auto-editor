name: build
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Make cache file
        run: |
          grep 'sha256: "' ae.nimble > cache.txt
      - name: Cache tarballs
        id: cache-tarballs
        uses: actions/cache@v5
        with:
          path: ffmpeg_sources
          key: tarballs-${{ hashFiles('cache.txt') }}
      - name: Homebrew
        if: steps.cache-tarballs.outputs.cache-hit != 'true'
        run: |
          /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          echo "/home/linuxbrew/.linuxbrew/bin" >> $GITHUB_PATH
      - name: Install packages
        if: steps.cache-tarballs.outputs.cache-hit != 'true'
        run: brew install nim
      - name: Download
        if: steps.cache-tarballs.outputs.cache-hit != 'true'
        run: nimble downloaddeps
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: deps
          path: ffmpeg_sources/*.tar.*
          if-no-files-found: error
  main:
    runs-on: ${{ matrix.os }}
    needs: fan
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            binary_name: auto-editor-linux-x86_64
          - os: ubuntu-24.04-arm
            binary_name: auto-editor-linux-aarch64
          - os: macos-latest
            binary_name: auto-editor-macos-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Get ffmpeg_sources
        uses: actions/download-artifact@v8
        with:
          name: deps
          path: ffmpeg_sources
      - name: Install Homebrew
        if: runner.os != 'macOS'
        run: |
          /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          echo "/home/linuxbrew/.linuxbrew/bin" >> $GITHUB_PATH
      - name: Install packages
        run: |
          brew update && brew install nim cmake
      - name: Setup
        run: |
          if [ "${{ matrix.os }}" = "ubuntu-24.04" ]; then
            sudo apt update
            sudo apt-get install -y build-essential pkg-config nasm git gperf fonts-dejavu-core
          elif [ "${{ matrix.os }}" = "ubuntu-24.04-arm" ]; then
            sudo apt update
            sudo apt-get install -y build-essential pkg-config git gperf fonts-dejavu-core
          elif [ "${{ matrix.os }}" = "macos-latest" ]; then
            echo "MACOSX_DEPLOYMENT_TARGET=14.0" >> $GITHUB_ENV
          fi
      - name: GCC/Clang version
        run: gcc --version
      - name: Build FFmpeg
        run: nimble makeff
      - name: Compile
        run: nimble make && mv auto-editor ${{ matrix.binary_name }}
      - name: Checkout tests
        uses: actions/checkout@v7
        with:
          repository: WyattBlue/auto-editor-tests
          token: ${{ secrets.TESTS_TOKEN }}
          path: tests
      - name: Test
        run: nimble test

      - name: Upload to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: ${{ matrix.binary_name }}*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  windows:
    runs-on: ubuntu-latest
    needs: fan
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Get ffmpeg_sources
        uses: actions/download-artifact@v8
        with:
          name: deps
          path: ffmpeg_sources
      - name: Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: "stable"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install llvm-mingw
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config nasm git
          curl -L -o llvm-mingw.tar.xz https://github.com/mstorsjo/llvm-mingw/releases/download/20260616/llvm-mingw-20260616-ucrt-ubuntu-22.04-x86_64.tar.xz
          tar xf llvm-mingw.tar.xz
          echo "$PWD/llvm-mingw-20260616-ucrt-ubuntu-22.04-x86_64/bin" >> $GITHUB_PATH
      - name: Build FFmpeg
        run: nimble makeffwin
      - name: Compile
        run: nimble makewin && mv auto-editor.exe auto-editor-windows-x86_64.exe
      - name: Upload to Release
        if: github.event_name == 'release' && vars.AZURE_SIGNING_ACCOUNT == ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: auto-editor-windows-x86_64.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Hand off for signing
        if: github.event_name == 'release' && vars.AZURE_SIGNING_ACCOUNT != ''
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-windows-x86_64
          path: auto-editor-windows-x86_64.exe

  windows-arm:
    runs-on: ubuntu-24.04-arm
    needs: fan
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Get ffmpeg_sources
        uses: actions/download-artifact@v8
        with:
          name: deps
          path: ffmpeg_sources
      - name: Install Homebrew
        run: |
          /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          echo "/home/linuxbrew/.linuxbrew/bin" >> $GITHUB_PATH
      - name: Install nim
        run: brew update && brew install nim
      - name: Install llvm-mingw
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config git meson
          curl -L -o llvm-mingw.tar.xz https://github.com/mstorsjo/llvm-mingw/releases/download/20260616/llvm-mingw-20260616-ucrt-ubuntu-22.04-aarch64.tar.xz
          tar xf llvm-mingw.tar.xz
          echo "$PWD/llvm-mingw-20260616-ucrt-ubuntu-22.04-aarch64/bin" >> $GITHUB_PATH
      - name: Build FFmpeg
        run: nimble makeffwinarm
      - name: Compile
        run: nimble makewinarm && mv auto-editor.exe auto-editor-windows-aarch64.exe
      - name: Upload to Release
        if: github.event_name == 'release' && vars.AZURE_SIGNING_ACCOUNT == ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: auto-editor-windows-aarch64.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Hand off for signing
        if: github.event_name == 'release' && vars.AZURE_SIGNING_ACCOUNT != ''
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-windows-aarch64
          path: auto-editor-windows-aarch64.exe

  sign-windows:
    # Only runs once the Azure Artifact Signing account is set up; until then
    # the Windows jobs upload unsigned binaries themselves.
    if: github.event_name == 'release' && vars.AZURE_SIGNING_ACCOUNT != ''
    runs-on: ubuntu-latest
    needs: [windows, windows-arm]
    # The federated credential trusts this environment, so only this job can
    # get a signing token, and the subject doesn't change per tag. Actions are
    # pinned by SHA because any of them could mint that token.
    environment: release-signing
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Get unsigned binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: unsigned-windows-*
          merge-multiple: true
      - name: Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Get jsign
        run: |
          curl -fsSL -o jsign.jar https://github.com/ebourg/jsign/releases/download/7.5/jsign-7.5.jar
          echo "602a51c3545a6dc4fb99bd2ea7152b26d1345916d0c93ddfbd5936cb735af91c  jsign.jar" | sha256sum -c
      - name: Get Azure token
        env:
          TENANT: ${{ vars.AZURE_TENANT_ID }}
          CLIENT: ${{ vars.AZURE_CLIENT_ID }}
        run: |
          jwt=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=api://AzureADTokenExchange" | jq -r .value)
          token=$(curl -fsS "https://login.microsoftonline.com/$TENANT/oauth2/v2.0/token" \
            --data-urlencode "client_id=$CLIENT" \
            --data-urlencode "scope=https://codesigning.azure.net/.default" \
            --data-urlencode "grant_type=client_credentials" \
            --data-urlencode "client_assertion_type=urn:ietf:params:oauth:client-assertion-type:jwt-bearer" \
            --data-urlencode "client_assertion=$jwt" | jq -r .access_token)
          echo "::add-mask::$token"
          echo "AZURE_TOKEN=$token" >> "$GITHUB_ENV"
      - name: Sign
        # One invocation for both files halves the signing API calls.
        run: |
          java -jar jsign.jar --storetype TRUSTEDSIGNING \
            --keystore "${{ vars.AZURE_SIGNING_ENDPOINT }}" \
            --storepass "$AZURE_TOKEN" \
            --alias "${{ vars.AZURE_SIGNING_ACCOUNT }}/${{ vars.AZURE_SIGNING_PROFILE }}" \
            --tsaurl http://timestamp.acs.microsoft.com --tsmode RFC3161 \
            auto-editor-windows-x86_64.exe auto-editor-windows-aarch64.exe
      - name: Upload to Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: |
            auto-editor-windows-x86_64.exe
            auto-editor-windows-aarch64.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  linux-armv7:
    runs-on: ubuntu-24.04-arm
    needs: fan
    env:
      DISABLE_WHISPER: "1"
      DISABLE_HEVC: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Get ffmpeg_sources
        uses: actions/download-artifact@v8
        with:
          name: deps
          path: ffmpeg_sources
      - name: Install Homebrew
        run: |
          /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          echo "/home/linuxbrew/.linuxbrew/bin" >> $GITHUB_PATH
      - name: Install nim
        run: brew update && brew install nim
      - name: Install ARMv7 cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config git meson gperf \
            gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf binutils-arm-linux-gnueabihf
      - name: Build FFmpeg
        run: nimble makeffarmv7
      - name: Compile
        run: nimble makearmv7 && mv auto-editor auto-editor-linux-armv7
      - name: Upload to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: auto-editor-linux-armv7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
